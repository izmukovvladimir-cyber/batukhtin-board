async function unlock(pw){
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:D.n,hash:'SHA-256'},base,
  {name:'AES-GCM',length:256},false,['decrypt']);
 const out=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},key,b(D.c));
 document.open();document.write(new TextDecoder().decode(out));document.close();
}
