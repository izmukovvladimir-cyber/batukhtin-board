const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:D.n,hash:'SHA-256'},base,
  {name:'AES-GCM',length:256},false,['decrypt']);
 return crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},key,b(D.c));
}
function show(out){document.open();document.write(new TextDecoder().decode(out));document.close();}
// remember the password in this browser after a successful unlock (Vladimir 10860); a wrong saved one is forgotten
const K='nb_pw';const ls={get(){try{return localStorage.getItem(K)}catch(_){return null}},
 set(v){try{localStorage.setItem(K,v)}catch(_){}},del(){try{localStorage.removeItem(K)}catch(_){}}};
let busy=false;const m=document.getElementById('m');
document.getElementById('f').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;
 const pw=document.getElementById('p').value;m.textContent='Открываю…';let out;
 try{out=await dec(pw);}catch(_){busy=false;m.textContent='Неверный пароль';return;}
 ls.set(pw);show(out);};
(async()=>{const s=ls.get();if(!s)return;busy=true;m.textContent='Открываю…';let out;
 try{out=await dec(s);}catch(err){busy=false;m.textContent='';if(err&&err.name==='OperationError'&&ls.get()===s)ls.del();return;}
 show(out);})();
